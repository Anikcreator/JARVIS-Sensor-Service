name: Build JARVIS Sensor Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/anik/jarvissensors

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS-Sensor-Service"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.anik.jarvissensors"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.anik.jarvissensors"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="JARVIS Sensor Service"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SensorService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="User-requested continuous device sensor monitoring for JARVIS automation" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/anik/jarvissensors/MainActivity.kt <<'EOF'
          package com.anik.jarvissensors

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 32, 32, 32)
                  }

                  val title = TextView(this).apply {
                      text = "JARVIS SENSOR SERVICE"
                      textSize = 24f
                      gravity = Gravity.CENTER
                  }

                  status = TextView(this).apply {
                      text = "Sensor service is stopped"
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setPadding(0, 32, 0, 32)
                  }

                  val start = Button(this).apply {
                      text = "START SENSOR MONITORING"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= 33 &&
                              checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(
                                  arrayOf(Manifest.permission.POST_NOTIFICATIONS), 10
                              )
                          }
                          startServiceNow()
                      }
                  }

                  val stop = Button(this).apply {
                      text = "STOP SENSOR MONITORING"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, SensorService::class.java))
                          status.text = "Sensor service stopped"
                      }
                  }

                  layout.addView(title)
                  layout.addView(status)
                  layout.addView(start)
                  layout.addView(stop)
                  setContentView(layout)
              }

              private fun startServiceNow() {
                  val intent = Intent(this, SensorService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
                  status.text = "Sensor monitoring requested"
              }
          }
          EOF

          cat > app/src/main/java/com/anik/jarvissensors/SensorService.kt <<'EOF'
          package com.anik.jarvissensors

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class SensorService : Service(), SensorEventListener {
              private lateinit var manager: SensorManager
              private var wakeLock: PowerManager.WakeLock? = null
              private val outputLock = Any()

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(7, notification())
                  manager = getSystemService(Context.SENSOR_SERVICE) as SensorManager

                  val power = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = power.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK, "JARVIS:SensorMonitoring"
                  )
                  wakeLock?.acquire()

                  val types = listOf(
                      Sensor.TYPE_ACCELEROMETER,
                      Sensor.TYPE_GYROSCOPE,
                      Sensor.TYPE_LIGHT,
                      Sensor.TYPE_STEP_DETECTOR,
                      Sensor.TYPE_STEP_COUNTER,
                      Sensor.TYPE_ROTATION_VECTOR
                  )

                  types.forEach { type ->
                      manager.getDefaultSensor(type)?.let {
                          manager.registerListener(this, it, SensorManager.SENSOR_DELAY_NORMAL)
                      }
                  }

                  writeLine("""{"event":"service_started","timestamp":${System.currentTimeMillis()}}""")
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }

              override fun onSensorChanged(event: SensorEvent) {
                  val values = event.values.joinToString(",")
                  val name = when (event.sensor.type) {
                      Sensor.TYPE_ACCELEROMETER -> "accelerometer"
                      Sensor.TYPE_GYROSCOPE -> "gyroscope"
                      Sensor.TYPE_LIGHT -> "light"
                      Sensor.TYPE_STEP_DETECTOR -> "step_detector"
                      Sensor.TYPE_STEP_COUNTER -> "step_counter"
                      Sensor.TYPE_ROTATION_VECTOR -> "rotation_vector"
                      else -> "unknown"
                  }

                  val line = """{"sensor":"$name","timestamp":${System.currentTimeMillis()},"values":[$values]}"""
                  writeLine(line)
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun writeLine(line: String) {
                  synchronized(outputLock) {
                      try {
                          val file = File(filesDir, "sensor_events.jsonl")
                          file.appendText(line + "\n")
                      } catch (_: Exception) {}
                  }
              }

              private fun notification(): Notification {
                  val builder = if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, "jarvis_sensors")
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }

                  return builder
                      .setContentTitle("JARVIS Sensor Service")
                      .setContentText("Monitoring device sensors")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          "jarvis_sensors",
                          "JARVIS Sensor Monitoring",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  manager.unregisterListener(this)
                  if (wakeLock?.isHeld == true) wakeLock?.release()
                  writeLine("""{"event":"service_stopped","timestamp":${System.currentTimeMillis()}}""")
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Sensor-Service
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
